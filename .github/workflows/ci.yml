name: Spring Boot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: gameflix
          MYSQL_USER: gameflix_user
          MYSQL_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_USER: gameflix_user
      MYSQL_PASSWORD: ci-test-password
      JWT_SECRET: ci-only-test-secret-not-real-0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Build Docker image
        run: docker build -t gameflix-backend .

      - name: Generate SBOM (Syft, CycloneDX)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/out anchore/syft:latest gameflix-backend -o cyclonedx-json=/out/sbom.cdx.json

      - name: Archive SBOM as build evidence
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Vulnerability report (HIGH and CRITICAL, informational)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL gameflix-backend

      - name: Scan and gate (fail the build on any CRITICAL)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --exit-code 1 gameflix-backend
