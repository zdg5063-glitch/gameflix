spring.application.name=gameflix

# Optional untracked file for local secrets (listed in .gitignore).
# Anything defined there overrides the values below.
spring.config.import=optional:file:./application-local.properties

# DATASOURCE CONFIGURATION (credentials come from environment variables, never committed)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gameflix?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA / HIBERNATE
# TODO: state in the README why you chose this value (update keeps data between runs).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
# Secret must be at least 32 random bytes for HS256. Never commit a real value.
app.jwt.secret=${JWT_SECRET}
# TODO: choose a lifetime and justify it in the README.
app.jwt.expiration-minutes=30

# CORS: exactly one front-end origin, never *
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}

# LOGGING
# Do not turn on org.hibernate.orm.results=TRACE or bind-parameter logging here:
# bound values (including password hashes) would end up in the logs.
logging.level.org.hibernate.SQL=DEBUG
